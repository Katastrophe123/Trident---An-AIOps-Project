name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Nothing in the test suite touches a real database or a real network, but
  # the settings object still needs a value to validate against.
  DATABASE_URL: sqlite+aiosqlite:///:memory:
  SERVICE_NAME: ci

jobs:
  quality:
    name: lint, types and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Type-check
        run: mypy services tools

      - name: Tests
        # The integration marker needs the compose stack, which is not run here.
        run: |
          pytest -m "not integration" \
            --cov=services --cov=tools \
            --cov-report=term-missing \
            --cov-fail-under=85

  compose:
    name: docker compose builds and starts
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # The whole claim of this project is "docker compose up and it works", so
      # CI checks exactly that rather than only building the image.
      - name: Validate the compose file
        run: |
          mkdir -p .chaos && touch .chaos/overrides.env
          docker compose config --quiet

      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Every service reports healthy
        run: |
          for port in 8001 8002 8003; do
            echo "--- localhost:$port/health"
            curl -fsS "http://localhost:$port/health" | tee /tmp/health.json
            grep -q '"status":"healthy"' /tmp/health.json
          done
          curl -fsS http://localhost:8080/health

      - name: Traffic reaches the database through all three services
        run: |
          python -m pip install httpx
          python -m tools.traffic --url http://localhost:8001 --count 20 --rate 10
          curl -fsS http://localhost:8001/orders/summary

      - name: Metrics expose the four required readings
        run: |
          curl -fsS http://localhost:8001/metrics \
            | python -c "import json,sys; m=json.load(sys.stdin); \
                assert m['requests'] > 0, m; \
                assert m['memory_mb'] > 0, m; \
                [m[k] for k in ('errors','average_latency_ms')]; \
                print('metrics ok:', m['requests'], 'requests')"

      - name: Logs are structured JSON
        run: |
          docker compose logs --no-color --tail 5 orders \
            | sed 's/^[^|]*| //' \
            | python -c "import json,sys; \
                lines=[l for l in sys.stdin if l.strip().startswith('{')]; \
                assert lines, 'no JSON log lines found'; \
                [json.loads(l) for l in lines]; \
                print(f'{len(lines)} structured log lines')"

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: docker compose down -v
